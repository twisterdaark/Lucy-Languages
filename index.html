<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lucy</title><meta name="description" content="Lucy, a sarcastic cat who teaches you Brazilian Portuguese"><meta name="theme-color" content="#15171f">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;600;700;800&family=Cairo:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --ink:#15171f;--bg2:#1b1e2b;--card:#222637;--card2:#2a2f44;--line:#363c55;
  --peach:#ffb98f;--peach2:#ff9a6a;--cream:#fff4e6;--slate:#a9b4c4;--dim:#7d869a;
  --olive:#d8d06a;--mint:#6ee7b7;--rose:#ff7b8a;--sky:#8ecae6;--violet:#b68cff;--lilac:#d9c8ff;
  --r:22px;--disp:'Bricolage Grotesque','Cairo',system-ui,sans-serif;--body:'Figtree','Cairo',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--ink);color:var(--cream);font:16px/1.45 var(--body)}
body{background:radial-gradient(120% 60% at 85% -10%,#3a2c3a 0,transparent 60%),radial-gradient(90% 50% at -10% 30%,#1f2b3a 0,transparent 60%),var(--ink)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--cream)}
h1,h2,h3{font-family:var(--disp);margin:0;letter-spacing:-.02em}
h1{font-size:34px;line-height:1.05;font-weight:800}
h2{font-size:21px;font-weight:700}
small{color:var(--slate)}
.ico{width:1.15em;height:1.15em;fill:currentColor;flex-shrink:0;vertical-align:-.2em}
.row{display:flex;align-items:center;gap:8px}.row.gap{gap:10px;flex-wrap:wrap}.spacer{flex:1}
.app{position:relative;max-width:480px;height:100%;margin:0 auto;overflow:hidden}
#view{height:100%;overflow-y:auto;overflow-x:hidden;padding:18px 16px 120px;scroll-behavior:smooth}
#view::-webkit-scrollbar{width:0}
.screen{display:flex;flex-direction:column;gap:16px}
.screen>*{flex-shrink:0}
.screen.enter>*{animation:rise .5s cubic-bezier(.2,.9,.3,1.2) both}
.screen.enter>*:nth-child(2){animation-delay:.05s}.screen.enter>*:nth-child(3){animation-delay:.1s}
.screen.enter>*:nth-child(4){animation-delay:.15s}.screen.enter>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}

/* Lucy */
.lucy{width:44px;height:44px;flex-shrink:0;overflow:visible;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3))}
.lucy.xs{width:26px;height:26px}.lucy.sm{width:52px;height:52px}
.lucy.big{width:150px;height:150px;animation:float 4.5s ease-in-out infinite}
.lucy.happy{animation:hop .7s cubic-bezier(.3,1.6,.5,1) 2}
.lucy.sleepy{transform:rotate(-12deg);filter:saturate(.7) drop-shadow(0 6px 10px rgba(0,0,0,.3));animation:breathe 3.5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes hop{40%{transform:translateY(-16px) rotate(-6deg)}}
@keyframes breathe{50%{transform:rotate(-12deg) scale(1.04)}}

/* home */
.brand{display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px}
.logo span{font:800 30px/1 var(--disp);letter-spacing:-.04em;background:linear-gradient(90deg,var(--cream),var(--peach));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand>small{font:600 12px var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.streak{display:flex;align-items:center;gap:5px;font:700 16px var(--disp);color:var(--peach);background:rgba(255,185,143,.12);padding:7px 12px;border-radius:99px}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font-size:17px;font-weight:700;transition:transform .15s,background .2s;flex-shrink:0}
.iconbtn:active{transform:scale(.9)}
.iconbtn.hi{background:var(--peach);color:var(--ink);border-color:transparent}
.hero{position:relative;display:flex;align-items:flex-end;gap:4px;padding:6px 0 0;min-height:160px}
.hero-cat{flex-shrink:0;margin-left:-8px}
.hero-say{flex:1;min-width:0;background:var(--cream);color:var(--ink);border-radius:24px 24px 24px 6px;padding:14px 16px;margin-bottom:62px;position:relative;animation:pop .5s .2s both}
.hero-say::before{content:'';position:absolute;left:-9px;bottom:0;border:10px solid transparent;border-right-color:var(--cream);border-bottom-color:var(--cream)}
.say-line{font:800 20px/1.15 var(--disp);text-align:left;display:block;letter-spacing:-.02em}
.say-line .ico{color:var(--peach2)}
.hero-say small{color:#6b6170;display:block;margin-top:2px}
.levelcard{display:flex;gap:16px;align-items:center;padding:16px;border-radius:28px;cursor:pointer;background:linear-gradient(135deg,#2c2a3e,#1f2333);border:1px solid var(--line);position:relative;overflow:hidden}
.levelcard::after{content:'';position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(var(--peach),transparent 70%);opacity:.18}
.lv-txt{min-width:0}.lv-txt b{display:block;font:800 24px/1.1 var(--disp);margin:2px 0 4px}.lv-txt p{margin:0;color:var(--slate);font-size:14px}
.eyebrow{font:700 11px var(--body);letter-spacing:.14em;color:var(--peach)!important;text-transform:uppercase}
.today{display:flex;flex-direction:column;gap:10px}
.mini{font:600 13px var(--body);color:var(--slate)}
.bar{height:8px;border-radius:9px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--peach2),var(--olive));transition:width 1s}
.task{display:flex;align-items:center;gap:14px;text-align:left;padding:12px 14px 12px 12px;border-radius:var(--r);background:var(--card);border:1px solid transparent;transition:transform .15s,border-color .2s}
.task:hover{border-color:var(--line)}.task:active{transform:scale(.98)}
.task>span:nth-child(2){flex:1;min-width:0}.task b{display:block;font-weight:700}.task small{display:block;font-size:13px}
.task>.ico{color:var(--dim);transform:rotate(-45deg)}
.tico{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:22px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);flex-shrink:0}

/* rings */
.ring{position:relative;flex-shrink:0}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-linecap:round}.ring .track{stroke:var(--card2)}
.ring .arc{stroke:url(#ringgrad);stroke:var(--peach);transition:stroke-dashoffset 1.4s cubic-bezier(.3,.9,.3,1)}
.ring .val{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ring .val b{font:800 26px var(--disp)}.ring .val small{font-size:12px;margin-top:3px}

/* page heads */
.pagehead{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.pagehead.row{flex-direction:row}
.sub{margin:0;color:var(--slate)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:16px;background:var(--peach);color:var(--ink);font:700 16px var(--body);transition:transform .15s,filter .2s;white-space:nowrap}
.btn:active{transform:scale(.96)}.btn:disabled{opacity:.4;cursor:default}
.btn.sm{padding:10px 14px;font-size:14px;border-radius:12px}
.btn.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.wide{flex:1;width:100%}.btn.alt{background:var(--olive)}
.link{color:var(--peach);font-weight:700;padding:8px 4px;align-self:flex-start}
.maker{display:flex;gap:12px;padding:16px;border-radius:var(--r);background:var(--card);border:1px dashed var(--line)}
.maker b{display:block}.maker small{display:block;font-size:13px}
.maker-in{display:flex;gap:8px;margin-top:10px}
.maker-in input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
.maker-in input:focus{border-color:var(--peach)}
.lvhead{display:flex;align-items:baseline;gap:10px;margin-top:8px}
.lvhead b{font:800 28px var(--disp);color:var(--peach)}.lvhead span{font:700 17px var(--disp)}
.lvhead.muted{opacity:.5}
.mlist{display:flex;flex-direction:column;gap:8px}
.mcard{display:flex;align-items:center;gap:14px;text-align:left;padding:14px;border-radius:var(--r);background:var(--card);animation:rise .45s both;transition:transform .15s;border-left:4px solid var(--card2)}
.mcard:active{transform:scale(.98)}
.mcard.done{border-left-color:var(--mint)}.mcard.hot{border-left-color:var(--rose)}
.mnum{font:800 22px var(--disp);color:var(--dim);width:30px}
.mbody{flex:1;min-width:0}.mbody b{display:block;font-weight:700}.mbody small{display:block;font-size:13px}
.mstate{font:800 13px var(--body);color:var(--dim)}.mcard.done .mstate{color:var(--mint)}.mcard.hot .mstate{color:var(--rose)}
.mstate .ico{transform:rotate(-45deg)}.mcard.done .mstate .ico{transform:none}

/* lesson */
.lesson-top{display:flex;align-items:center;gap:10px;position:sticky;top:-18px;z-index:3;padding:10px 0;margin-top:-10px;background:linear-gradient(var(--ink) 75%,transparent)}
.steps{display:flex;gap:4px;flex:1;min-width:0}
.steps span{flex:1;display:flex;flex-direction:column;gap:5px;font:700 10px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);text-align:center}
.steps i{height:5px;border-radius:5px;background:var(--card2);transition:background .3s}
.steps span.done i{background:var(--mint)}.steps span.on{color:var(--peach)}.steps span.on i{background:var(--peach)}
.lbody,.stepbox{display:flex;flex-direction:column;gap:16px}
.stepbox{animation:rise .45s both}
.coach-row{display:flex;align-items:flex-end;gap:8px}
.coach-row .bubble{flex:1;min-width:0;background:var(--card);border-radius:20px 20px 20px 6px;padding:11px 14px;animation:pop .4s both}
.coach-row .bubble b{display:block;font:800 18px/1.2 var(--disp)}.coach-row .bubble small{display:block;font-size:14px;margin-top:2px}
.coach-row.happy .bubble{background:color-mix(in srgb,var(--mint) 18%,var(--card))}.coach-row.happy .lucy{animation:hop .7s cubic-bezier(.3,1.6,.5,1) 2}
.coach-row.meh .bubble{background:color-mix(in srgb,var(--olive) 14%,var(--card))}
.ltitle{font-size:28px}
.lines{display:flex;flex-direction:column;gap:8px}
.line{padding:10px 14px;border-radius:18px 18px 18px 6px;background:var(--card);max-width:88%;cursor:pointer;transition:transform .2s,box-shadow .2s}
.line small{font:800 10px var(--body);letter-spacing:.12em}
.line.me{align-self:flex-end;border-radius:18px 18px 6px 18px;background:#33304a}
.line .pt{font-weight:700;font-size:17px}.line .en{color:var(--slate);font-size:14px}
.line.live{box-shadow:0 0 0 2px var(--peach);transform:scale(1.02)}
.noen .en{display:none}
.lesson-foot{margin-top:6px}
.chunks{display:flex;flex-direction:column;gap:8px}
.chunk{text-align:left;padding:12px 14px;border-radius:18px;background:var(--card);border-left:4px solid var(--c);transition:transform .15s}
.chunk b{font-size:17px}.chunk small{display:block}.chunk p{margin:6px 0 0;font-size:13px;color:var(--dim)}
.chunk .ico{color:var(--c)}
.chunk.hit{animation:pop .35s}
.chunk.slur{background:repeating-linear-gradient(135deg,var(--card) 0 10px,#26243a 10px 20px)}
.heat{font:800 10px var(--body);letter-spacing:.08em;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);padding:3px 8px;border-radius:99px;white-space:nowrap}
.target{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:26px;background:var(--card)}
.tag{font:800 11px var(--body);letter-spacing:.1em;padding:5px 10px;border-radius:99px;background:var(--card2);color:var(--slate)}
.tag.hot{background:var(--rose);color:var(--ink)}
.words{font:700 24px/1.3 var(--disp);letter-spacing:-.01em}
.words.small{font-size:18px}
.words span{cursor:pointer;border-radius:6px;transition:color .3s,background .3s}
.words span.g{color:var(--mint)}.words span.y{color:var(--olive)}.words span.r{color:var(--rose);text-decoration:underline wavy;text-underline-offset:4px}
.gloss{color:var(--slate)}.ipa{color:var(--dim);font-family:ui-monospace,monospace;font-size:14px}
.heard{color:var(--dim);font-size:14px;min-height:1em;font-style:italic}
.mic-wrap{display:grid;place-items:center;position:relative;margin-top:4px}
.mic{width:84px;height:84px;border-radius:50%;background:var(--peach);color:var(--ink);font-size:36px;display:grid;place-items:center;position:relative;z-index:1;transition:transform .2s,background .2s;box-shadow:0 10px 30px rgba(255,154,106,.35)}
.mic:active{transform:scale(.92)}
.mic-wrap::before,.mic-wrap::after{content:'';position:absolute;width:84px;height:84px;border-radius:50%;border:2px solid var(--peach);opacity:0}
.mic-wrap.live .mic{background:var(--rose)}
.mic-wrap.live::before{animation:ripple 1.4s infinite}.mic-wrap.live::after{animation:ripple 1.4s .7s infinite}
@keyframes ripple{from{transform:scale(1);opacity:.7}to{transform:scale(1.9);opacity:0}}
.mic-label{text-align:center;margin:-6px 0 0;color:var(--slate);font-size:14px}
.recall{display:flex;flex-direction:column;gap:10px;padding:20px 16px;border-radius:26px;background:var(--card);text-align:center;align-items:center}
.recall .big{font:800 26px/1.15 var(--disp)}
.answer{display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .35s}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades button{padding:12px 6px;border-radius:16px;background:var(--card);border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);display:flex;flex-direction:column;align-items:center}
.grades button b{color:var(--c)}.grades button small{font-size:12px}
.grades button.sugg{background:color-mix(in srgb,var(--c) 22%,var(--card));animation:pop .4s}
.write{width:100%;min-height:84px;resize:none;border-radius:16px;background:var(--ink);border:1px solid var(--line);padding:12px;font-size:18px;outline:none}
.write:focus{border-color:var(--peach)}
.accents{display:flex;flex-wrap:wrap;gap:6px}
.accents button{width:38px;height:38px;border-radius:10px;background:var(--card2);font-weight:700;font-size:17px}
.finish{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.stats{display:flex;gap:8px;width:100%}
.stats>div,.statrow>div{flex:1;padding:12px;border-radius:18px;background:var(--card);display:flex;flex-direction:column}
.stats small,.statrow small{font:800 10px var(--body);letter-spacing:.1em}
.stats b,.statrow b{font:800 24px var(--disp)}
.statrow b em{font:600 12px var(--body);color:var(--slate);font-style:normal;display:block}
.goalcard{width:100%;padding:16px;border-radius:22px;background:linear-gradient(135deg,#3b2d33,#2a2639);text-align:left;border:1px solid #574052}
.goalcard b{display:block;font:700 18px/1.3 var(--disp);margin-top:4px}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:24px 8px}
.empty b{font:800 22px var(--disp)}.empty p{margin:0;color:var(--slate)}

/* progress */
.statrow{display:flex;gap:8px}
.card{padding:16px;border-radius:var(--r);background:var(--card);display:flex;flex-direction:column;gap:12px}
.week{display:flex;gap:8px;height:130px}
.wcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.wbar{flex:1;width:100%;position:relative;border-radius:10px;background:var(--card2);overflow:hidden}
.wbar i{position:absolute;bottom:0;left:0;right:0;background:var(--sky);border-radius:10px;animation:grow .9s cubic-bezier(.3,1.3,.5,1) both}
.wbar i.hit{background:var(--peach)}
.goalline{position:absolute;left:0;right:0;border-top:2px dashed rgba(255,244,230,.45)}
@keyframes grow{from{transform:scaleY(0);transform-origin:bottom}}
.wcol small{font:700 11px var(--body)}
.sect{margin-top:8px;display:flex;align-items:center;gap:8px}
.ladder{display:flex;flex-direction:column;gap:10px}
.rung{display:flex;gap:14px;padding:14px;border-radius:var(--r);background:var(--card);opacity:.75}
.rung.cur{opacity:1;box-shadow:inset 0 0 0 2px var(--peach)}.rung.got{opacity:1}
.rung.got .arc{stroke:var(--mint)}
.rung .ring .val b{font-size:17px}
.rung-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.rung-txt p{margin:0;font-size:14px;color:var(--slate)}.rung-txt>small{font-size:13px}.rung-txt .ok{color:var(--mint);font-weight:700}
.subbars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:4px}
.subbars span{height:6px;border-radius:6px;background:var(--card2);overflow:hidden}
.subbars span i{display:block;height:100%;background:var(--peach);border-radius:6px}
.subbars span:nth-child(2) i{background:var(--sky)}.subbars span:nth-child(3) i{background:var(--olive)}
.sublbl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.sublbl small{font-size:11px}
.fine{font-size:13px;color:var(--dim);margin:0}.fine.center{text-align:center}
.miles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mile{padding:12px;border-radius:18px;background:var(--card);display:flex;flex-direction:column;gap:2px;opacity:.55}
.mile span{font-size:20px;color:var(--dim)}.mile b{font-size:14px;line-height:1.2}.mile small{font-size:12px;line-height:1.3}
.mile.ok{opacity:1;background:color-mix(in srgb,var(--olive) 14%,var(--card))}.mile.ok span{color:var(--olive)}
.tricky{display:flex;flex-wrap:wrap;gap:8px}
.tricky button{padding:8px 12px;border-radius:12px;background:var(--card);font-weight:700}
.tricky small{margin-left:6px;color:var(--rose)}

/* gym */
.deck,.sugg{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.deck::-webkit-scrollbar,.sugg::-webkit-scrollbar{display:none}
.chipbtn{flex-shrink:0;padding:9px 14px;border-radius:99px;background:var(--card);font-weight:700;font-size:14px;white-space:nowrap;border:1px solid var(--line)}
.chipbtn.on{background:var(--cream);color:var(--ink);border-color:transparent}
.score{display:flex;gap:18px;align-items:center;padding:16px;border-radius:var(--r);background:var(--card)}
.meters{flex:1;display:flex;flex-direction:column;gap:10px}
.meters label{display:flex;justify-content:space-between;font-size:13px;color:var(--slate)}
.meter{height:8px;border-radius:8px;background:var(--card2);overflow:hidden;margin-top:4px}
.meter i{display:block;height:100%;width:0;background:var(--peach);border-radius:8px;transition:width 1s cubic-bezier(.3,.9,.3,1)}

/* talk */
.scenes{display:flex;flex-direction:column;gap:8px}
.scene{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--r);background:var(--card);animation:rise .45s both}
.scene.feature{background:linear-gradient(135deg,color-mix(in srgb,var(--peach) 22%,var(--card)),var(--card));padding:16px 12px}
.av{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:22px;color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent);flex-shrink:0}
.av .lucy{width:46px;height:46px}
.sbody{flex:1;min-width:0}.sbody b{display:block}.sbody small{display:block;font-size:13px}
.acts{display:flex;gap:6px}
.chat-head{display:flex;align-items:center;gap:10px;position:sticky;top:-18px;z-index:3;padding:10px 0;margin-top:-10px;background:linear-gradient(var(--ink) 80%,transparent)}
.chat-head b{display:block}.chat-head small{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.letter{font:800 22px var(--disp);color:var(--c)}
.msgs{display:flex;flex-direction:column;gap:8px;min-height:200px}
.mission-tag{align-self:center;font-size:13px;padding:6px 12px;border-radius:99px;background:#3b2d33;color:var(--peach);text-align:center}
.msg{max-width:84%;padding:10px 14px;border-radius:20px;animation:pop .3s both;position:relative}
.msg.bot{background:var(--card);border-bottom-left-radius:6px;align-self:flex-start;padding-right:40px}
.msg.me{background:var(--peach);color:var(--ink);border-bottom-right-radius:6px;align-self:flex-end;font-weight:600}
.msg small{display:block;font-size:13px;margin-top:2px}
.msg .say{position:absolute;right:10px;top:9px;color:var(--peach)}
.fix{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:10px 12px;border-radius:16px;background:color-mix(in srgb,var(--olive) 14%,var(--card));animation:pop .3s both}
.fix b{color:var(--olive)}
.typing{align-self:flex-start;display:flex;gap:5px;padding:14px 16px;border-radius:20px;background:var(--card)}
.typing i{width:8px;height:8px;border-radius:50%;background:var(--slate);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-5px);opacity:.4}}
.composer{display:flex;gap:8px;position:sticky;bottom:-30px;padding:8px 0 4px;background:linear-gradient(transparent,var(--ink) 30%)}
.composer input{flex:1;min-width:0;border-radius:16px;background:var(--card);border:1px solid var(--line);padding:12px 14px;outline:none}
.composer input:focus{border-color:var(--peach)}
.mic-s.live{background:var(--rose);color:var(--ink);animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,123,138,.25)}}

/* call */
.call{align-items:center;text-align:center;min-height:calc(100vh - 40px);justify-content:space-between;padding-bottom:20px}
.call-top b{display:block;font:800 26px var(--disp)}
.orb-wrap{position:relative;width:220px;height:220px;display:grid;place-items:center}
.orb-wrap::before,.orb-wrap::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 40%,transparent),transparent 70%);transition:transform .4s}
.orb-wrap.talk::before{animation:breath 1.2s ease-in-out infinite}.orb-wrap.talk::after{animation:breath 1.2s .6s ease-in-out infinite}
@keyframes breath{50%{transform:scale(1.25);opacity:.6}}
.orb{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#383d58,#1d2030);border:2px solid color-mix(in srgb,var(--c) 50%,transparent);position:relative;z-index:1}
.orb .lucy.big{width:136px;height:136px}.orb .letter{font-size:64px}
.wave{display:flex;gap:4px;align-items:center;height:60px}
.wave i{width:5px;height:6px;border-radius:5px;background:var(--peach);transition:height .3s}
.wave.on i{animation:wv .7s ease-in-out infinite alternate}
@keyframes wv{to{height:var(--h)}}
.captions{min-height:96px;padding:0 10px}.captions small{font:800 11px var(--body);letter-spacing:.12em}
.captions .pt{font:700 21px/1.25 var(--disp)}.captions .en{color:var(--slate);font-size:14px}
.controls{display:flex;gap:22px;align-items:flex-end}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--slate)}
.ctrl span{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--card);font-weight:800;font-size:16px;color:var(--cream)}
.ctrl.main span{width:84px;height:84px;background:var(--peach);color:var(--ink);font-size:34px}
.ctrl.main.ready span{animation:pulse2 1.4s infinite}.ctrl.main.live span{background:var(--rose)}
@keyframes pulse2{50%{box-shadow:0 0 0 12px rgba(255,185,143,.2)}}
.endcall{color:var(--rose);box-shadow:inset 0 0 0 1.5px rgba(255,123,138,.5)}

/* dock */
#dock{position:absolute;left:12px;right:12px;bottom:14px;z-index:10;display:flex;gap:4px;padding:6px;border-radius:24px;background:rgba(34,38,55,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.4)}
#dock button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:48px;border-radius:18px;color:var(--slate);font-weight:700;font-size:14px;transition:flex .35s cubic-bezier(.3,1.2,.4,1),background .25s,color .25s;overflow:hidden;white-space:nowrap;min-width:0}
#dock button .ico{font-size:20px}
#dock button span{max-width:0;opacity:0;transition:max-width .35s,opacity .25s}
#dock button.on{flex:2.3;background:var(--peach);color:var(--ink)}
#dock button.on span{max-width:90px;opacity:1}

/* overlays */
#modal{position:absolute;inset:0;z-index:20;background:rgba(10,11,16,.6);display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity .25s}
#modal.show{opacity:1;pointer-events:auto}
#panel{width:100%;max-height:88%;overflow:auto;background:var(--bg2);border-radius:28px 28px 0 0;padding:22px 18px 30px;transform:translateY(40px);transition:transform .35s cubic-bezier(.3,1.2,.4,1);display:flex;flex-direction:column;gap:10px}
#modal.show #panel{transform:none}
#panel p{color:var(--slate)}
.photo{width:84px;height:84px;border-radius:22px;object-fit:cover;flex-shrink:0;transform:rotate(-4deg);border:3px solid var(--cream)}
.lbl{font:800 11px var(--body);letter-spacing:.1em;text-transform:uppercase;margin:8px 0 0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}.seg.four{grid-template-columns:repeat(4,1fr)}.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{padding:11px 8px;border-radius:14px;background:var(--card);font-size:14px;font-weight:600;border:1.5px solid transparent}
.seg button.on{border-color:var(--peach);color:var(--peach)}
#toast{position:absolute;left:50%;top:16px;z-index:30;transform:translate(-50%,-80px);max-width:90%;padding:11px 16px;border-radius:16px;background:var(--cream);color:var(--ink);font-weight:700;font-size:14px;transition:transform .35s cubic-bezier(.3,1.3,.4,1);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#toast.show{transform:translate(-50%,0)}
.confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:25}
#vk{position:absolute;inset:0;z-index:22;background:rgba(10,11,16,.55);display:flex;align-items:flex-end}
#vk .sheet{width:100%;background:var(--bg2);border-radius:28px 28px 0 0;padding:20px 18px 24px;display:flex;flex-direction:column;gap:10px;animation:rise .35s both}
#vk-target{font:800 20px/1.25 var(--disp)}
#vk-in{width:100%;min-height:70px;resize:none;border-radius:16px;background:var(--ink);border:1.5px solid var(--peach);padding:12px;font-size:18px;outline:none}
.vk-hint{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--slate)}
.vk-hint .ico{color:var(--peach);font-size:22px;animation:pulse 1.2s infinite;border-radius:50%}
.chev{font:700 26px/1 var(--disp);color:var(--dim);margin-top:-3px}
.msgs{min-height:calc(100vh - 330px);justify-content:flex-end}
.chev{font-size:0;width:10px;height:10px;margin:0 6px 0 2px;border:solid var(--dim);border-width:2.5px 2.5px 0 0;border-radius:2px;transform:rotate(45deg);flex-shrink:0;display:inline-block}
.langs{display:flex;gap:6px;overflow-x:auto;margin:0 -18px;padding:0 18px;scrollbar-width:none}
.langs button{flex-shrink:0;padding:10px 14px;border-radius:14px;background:var(--card);border:1.5px solid transparent;text-align:left;display:flex;flex-direction:column}
.langs button.on{border-color:var(--peach)}.langs button b{font-size:15px}.langs button small{font-size:11px}
.langs button:disabled{opacity:.45;cursor:default}
.vrow{display:flex;flex-direction:column;gap:4px}.vrow small{font-size:12px}
.seg.four button{padding:10px 4px;text-transform:capitalize}
/* Lucy blink: lids sit at zero height and drop for a moment (CSS, no SMIL) */
.lucy .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 4.6s var(--bd,0s) infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
.lucy.sleepy .lid{animation:none;transform:scaleY(1)}
#panel>*{flex-shrink:0}

/* ---- Arabic course: script runs right-to-left, Franco sits under it ---- */
.pt,.words,.big,.msg,.chunk b,.ltitle,.say-line,.mbody b,.sbody b,.captions .pt,.bubble b,.fix b,.finish h1,.goalcard b,#vk-target,input,textarea,.chipbtn{unicode-bidi:plaintext}
.rtl-course :is(.pt,.words,.msg,.chunk b,.ltitle,.captions .pt){text-align:start}
.rom{direction:ltr;unicode-bidi:isolate;color:var(--dim);font:italic 500 14px/1.35 var(--body);margin-top:3px;letter-spacing:.01em}
.romi{display:block;direction:ltr;unicode-bidi:isolate;font-style:italic;font-weight:500;color:var(--dim);font-size:.78em;margin-top:2px}
.chipbtn small{display:block;font:italic 500 11px var(--body);color:var(--dim);margin-top:1px}
.rtl-course .words span,.rtl-course .pt span{font-size:1.08em}
</style>

oser! The mangoes are like honey!":{"pt":"Chega mais! As mangas tão que nem mel!","ar":"قرب! المانجة زي العسل!"},"How much is a kilo?":{"pt":"Quanto tá o quilo?","ar":"بكام الكيلو؟"},"Just fifty pounds.":{"pt":"Só cinquenta libras.","ar":"بخمسين جنيه بس."},"Fifty?! That’s way too much! For forty?":{"pt":"Cinquenta?! Tá caro demais! Por quarenta?","ar":"خمسين؟! ده غالي أوي! بأربعين؟"},"Fine, forty-five just for you.":{"pt":"Tá bom, quarenta e cinco só por você.","ar":"خلاص، بخمسة وأربعين عشان خاطرك."},"Deal!":{"pt":"Fechado!","ar":"اتفقنا!"},"how much is this?":{"pt":"quanto custa isso?","ar":"بكام ده؟"},"very expensive":{"pt":"muito caro","ar":"غالي أوي"},"“Awi” = very. Say it with a pained face.":{"pt":"“Awi” = muito. Fala com cara de sofrimento.","ar":"“Awi” = very. قولها ووشك متألم."},"fifty pounds":{"pt":"cinquenta libras","ar":"خمسين جنيه"},"“Gneh” is the Egyptian pound.":{"pt":"“Gneh” é a libra egípcia.","ar":"“Gneh” هو الجنيه المصري."},"for forty?":{"pt":"por quarenta?","ar":"بأربعين؟"},"Counter-offer by just saying a lower number.":{"pt":"Faz uma contraproposta só dizendo um número menor.","ar":"اعمل عرض تاني بأنك تقول رقم أقل."},"just for you":{"pt":"só por você","ar":"عشان خاطرك"},"Lit. “for your sake”.":{"pt":"Lit. “por sua causa”.","ar":"حرفياً “for your sake”."},"The Egyptian “okay”. Literally “walking”.":{"pt":"O “tá bom” egípcio. Literalmente “andando”.","ar":"“okay” بالمصري. حرفياً “walking”."},"deal! / agreed":{"pt":"fechado! / combinado","ar":"اتفقنا!"},"Ask directions":{"pt":"Pedir direções","ar":"اسأل عن الاتجاهات"},"Ask Karim how to get to the metro and whether it’s far.":{"pt":"Pergunta pro Karim como chegar no metrô e se é longe.","ar":"اسأل كريم إزاي تروح المترو وهل هو بعيد ولا لأ."},"you allow":{"pt":"você permite","ar":"بعد إذنك"},"where":{"pt":"onde","ar":"فين"},"the metro":{"pt":"o metrô","ar":"المترو"},"close":{"pt":"perto","ar":"قريب"},"walk":{"pt":"andar","ar":"امشي"},"on":{"pt":"em","ar":"على"},"length (= straight)":{"pt":"comprimento (= reto)","ar":"طول (= طوالي)"},"and go in (= turn)":{"pt":"e entra (= vira)","ar":"وخش (= احود)"},"right":{"pt":"direita","ar":"يمين"},"far":{"pt":"longe","ar":"بعيد"},"minutes":{"pt":"minutos","ar":"دقايق"},"walking":{"pt":"andando","ar":"مشي"},"hey":{"pt":"ei","ar":"يا"},"captain":{"pt":"capitão","ar":"كابتن"},"you’re welcome":{"pt":"de nada","ar":"العفو"},"keep":{"pt":"manter","ar":"خلي"},"your mind":{"pt":"sua cabeça","ar":"بالك"},"the tuk-tuks":{"pt":"os tuk-tuks","ar":"التكاتك"},"Excuse me, where’s the metro?":{"pt":"Com licença, onde fica o metrô?","ar":"بعد إذنك، فين المترو؟"},"The metro? It’s close. Go straight and turn right.":{"pt":"O metrô? É perto. Vai reto e vira à direita.","ar":"المترو؟ ده قريب. امشي على طول وخش يمين."},"Is it far?":{"pt":"É longe?","ar":"هو بعيد؟"},"No, five minutes on foot.":{"pt":"Não, cinco minutos a pé.","ar":"لأ، خمس دقايق مشي."},"Thanks, man!":{"pt":"Valeu, cara!","ar":"تسلم يا كابتن!"},"You’re welcome. Watch out for the tuk-tuks!":{"pt":"De nada. Cuidado com os tuk-tuks!","ar":"العفو. خلي بالك من التكاتك!"},"where is…?":{"pt":"onde fica…?","ar":"فين...؟"},"straight ahead":{"pt":"siga reto","ar":"على طول"},"Also “all the time”.":{"pt":"Também “o tempo todo”.","ar":"كمان “all the time”."},"turn right":{"pt":"virar à direita","ar":"خش يمين"},"“Shmal” = left.":{"pt":"“Shmal” = esquerda.","ar":"“Shmal” = شمال."},"close by":{"pt":"aqui perto","ar":"قريب"},"“Be3eed” = far.":{"pt":"“Be3eed” = longe.","ar":"“Be3eed” = بعيد."},"five minutes":{"pt":"cinco minutos","ar":"خمس دقايق"},"hey man (to a stranger)":{"pt":"e aí, mano (pra um estranho)","ar":"يا معلم (لحد ما تعرفوش)"},"How Cairenes address any guy. “Ya basha” works too.":{"pt":"Como a galera do Cairo chama qualquer cara. “Ya basha” também serve.","ar":"الطريقة اللي بتوع القاهرة بينادوا بيها أي حد. “Ya basha” تنفع برضه."},"watch out":{"pt":"cuidado","ar":"خلي بالك"},"To a woman: khalli balek.":{"pt":"Pra mulher: khalli balek.","ar":"للستات: khalli balek."},"Ride & small talk":{"pt":"Corrida e papo furado","ar":"التوصيلة والدردشة الخفيفة"},"Get Osta Ashraf to take you to Zamalek and survive his football talk.":{"pt":"Faça o Osta Ashraf te levar pra Zamalek e sobreviva ao papo de futebol dele.","ar":"خلي الأسطى أشرف يوصلك الزمالك وعافر عشان تستحمل كلامه عن الكورة."},"to":{"pt":"pra","ar":"على / لـ"},"boss":{"pt":"chefe","ar":"يا باشا"},"Zamalek":{"pt":"Zamalek","ar":"الزمالك"},"protector (= good grief)":{"pt":"protetor (= misericórdia)","ar":"يا ساتر (= good grief)"},"the traffic":{"pt":"o trânsito","ar":"الزحمة"},"today":{"pt":"hoje","ar":"النهاردة"},"hard":{"pt":"difícil","ar":"صعب"},"not":{"pt":"não","ar":"مش"},"problem":{"pt":"problema","ar":"مشكلة"},"in a hurry":{"pt":"com pressa","ar":"مستعجل"},"Ahly fan":{"pt":"torcedor do Ahly","ar":"أهلاوي"},"or":{"pt":"ou","ar":"ولا"},"Zamalek fan":{"pt":"torcedor do Zamalek","ar":"زملكاوي"},"of course":{"pt":"com certeza","ar":"أكيد"},"Where to, boss?":{"pt":"Pra onde, chefe?","ar":"على فين يا باشا؟"},"Zamalek, please.":{"pt":"Zamalek, por favor.","ar":"الزمالك، لو سمحت."},"Good grief! The traffic today is rough.":{"pt":"Misericórdia! O trânsito hoje tá osso.","ar":"يا ساتر! الزحمة النهاردة تقيلة."},"No problem, I’m not in a hurry.":{"pt":"Sem problemas, não tô com pressa.","ar":"مفيش مشكلة، أنا مش مستعجل."},"Are you an Ahly or a Zamalek fan?":{"pt":"Você torce pro Ahly ou pro Zamalek?","ar":"أنت أهلاوي ولا زملكاوي؟"},"Ahly, of course!":{"pt":"Ahly, com certeza!","ar":"أهلاوي أكيد!"},"where to?":{"pt":"pra onde?","ar":"على فين؟"},"good grief!":{"pt":"misericórdia!","ar":"يا ساتر!"},"For any disaster, including traffic.":{"pt":"Pra qualquer desastre, inclusive o trânsito.","ar":"لأي مصيبة، بما فيها الزحمة."},"the traffic / the crowd":{"pt":"o trânsito / a muvuca","ar":"المرور / الزحمة"},"The most-used word in Cairo.":{"pt":"A palavra mais usada no Cairo.","ar":"أكتر كلمة مستخدمة في القاهرة."},"no problem":{"pt":"sem problema","ar":"مفيش مشكلة"},"I’m not in a hurry":{"pt":"não tô com pressa","ar":"أنا مش مستعجل"},"Women: mesh mesta3gela.":{"pt":"Mulheres: mesh mesta3gela.","ar":"للستات: mesh mesta3gela."},"Ahly or Zamalek fan?":{"pt":"Torce pro Ahly ou pro Zamalek?","ar":"أهلاوي ولا زملكاوي؟"},"The only question that matters in Egypt.":{"pt":"A única pergunta que importa no Egito.","ar":"السؤال الوحيد اللي يفرق في مصر."},"here is good":{"pt":"aqui tá bom","ar":"عندك هنا كويس"},"Say it to stop the car.":{"pt":"Diga isso pra parar o carro.","ar":"قولها عشان توقف العربية."},"Texting like an Egyptian":{"pt":"Trocando mensagem que nem um egípcio","ar":"الشات زي المصريين"},"Text Nour, apologise for disappearing and make plans for tonight.":{"pt":"Manda mensagem pro Nour, pede desculpa pelo sumiço e combina de fazer algo hoje à noite.","ar":"ابعت لنور، واعتذر إنك اختفيت واتفقوا تخرجوا بالليل."},"traitor (playful)":{"pt":"traíra (na zoeira)","ar":"يا خاين (بهزار)"},"vanished":{"pt":"sumiu","ar":"اختفيت"},"why":{"pt":"por que","ar":"ليه"},"sorry":{"pt":"desculpa","ar":"معلش"},"I was":{"pt":"eu tava","ar":"كنت"},"busy":{"pt":"ocupado","ar":"مشغول"},"uncle (= dude)":{"pt":"tio (= mano)","ar":"يا عم (= dude)"},"we go out":{"pt":"a gente sai","ar":"نخرج"},"let’s go":{"pt":"bora","ar":"يلا بينا"},"the hour":{"pt":"a hora","ar":"الساعة"},"how much / what":{"pt":"quanto / que","ar":"كام / إيه"},"nine":{"pt":"nove","ar":"تسعة"},"don’t be late":{"pt":"não atrasa","ar":"متتأخرش"},"yes, sir":{"pt":"sim, senhor","ar":"تمام يا باشا"},"sir / ma’am":{"pt":"senhor / senhora","ar":"يا باشا / يا فندم"},"Hey, traitor! Why have you vanished?":{"pt":"E aí, traíra! Por que você sumiu?","ar":"إيه يا خاين! اختفيت ليه؟"},"Sorry, I was super busy.":{"pt":"Mal aí, eu tava super ocupado.","ar":"معلش، كنت مشغول جداً."},"Sure, man. Shall we go out today?":{"pt":"Claro, mano. Bora sair hoje?","ar":"أكيد يا صاحبي. ننزل النهاردة؟"},"Let’s go! What time?":{"pt":"Bora! Que horas?","ar":"يلا بينا! الساعة كام؟"},"Nine. Don’t be late!":{"pt":"Nove. Não atrasa!","ar":"الساعة تسعة. متتأخرش!"},"Yes, ma’am.":{"pt":"Sim, senhora.","ar":"حاضر يا فندم."},"why have you vanished?":{"pt":"por que você sumiu?","ar":"اختفيت ليه؟"},"sorry / never mind":{"pt":"desculpa / deixa pra lá","ar":"معلش / ولا يهمك"},"Egypt’s most useful word.":{"pt":"A palavra mais útil do Egito.","ar":"أكتر كلمة مفيدة في مصر."},"dude (lit. uncle)":{"pt":"mano (lit. tio)","ar":"يا عم (حرفياً: عم)"},"shall we go out?":{"pt":"bora sair?","ar":"ننزل؟"},"let’s go!":{"pt":"bora!","ar":"يلا بينا!"},"don’t be late!":{"pt":"não atrasa!","ar":"متتأخرش!"},"“Ma…sh” wrapped around a verb makes “don’t”.":{"pt":"“Ma…sh” em volta de um verbo vira “não”.","ar":"«ما...ش» حوالين الفعل بتعمل «لا»."},"okay / perfect":{"pt":"beleza / perfeito","ar":"ماشي / تمام"},"In texts: tmm. Franco swaps letters for numbers: 2 = ء, 3 = ع, 5 = خ, 7 = ح.":{"pt":"Nas mensagens: tmm. O Franco troca letras por números: 2 = ء, 3 = ع, 5 = خ, 7 = ح.","ar":"في الشات: tmm. الفرانكو بيبدل الحروف بأرقام: 2 = ء, 3 = ع, 5 = خ, 7 = ح."},"Street talk & cusses":{"pt":"Gírias e xingamentos","ar":"كلام الشارع والشتائم"},"Banter with Mido at the ahwa: apologise for being late, insult him back and challenge him to backgammon.":{"pt":"Tirando onda com o Mido no ahwa: peça desculpas pelo atraso, xingue ele de volta e desafie pro gamão.","ar":"هزار مع ميدو على القهوة: اعتذر له إنك اتأخرت، ورّد عليه الشتيمة واتحداه في الطاولة."},"son":{"pt":"filho"},"the dog":{"pt":"o cachorro"},"you’re late":{"pt":"você tá atrasado","ar":"إنت اتأخرت"},"an hour":{"pt":"uma hora","ar":"ساعة"},"was":{"pt":"tava","ar":"كان"},"donkey":{"pt":"burro","ar":"حمار"},"will you play":{"pt":"vai jogar","ar":"هتلعب"},"backgammon":{"pt":"gamão","ar":"طاولة"},"will you watch":{"pt":"vai assistir","ar":"هتتفرج"},"I’ll play":{"pt":"eu vou jogar","ar":"هلعب"},"and I’ll beat you":{"pt":"e vou te quebrar","ar":"وهغلبك"},"hahaha":{"pt":"hahaha","ar":"ههههه"},"go":{"pt":"vai","ar":"إمشي"},"loser":{"pt":"perdedor","ar":"فاشل"},"shut up":{"pt":"cala a boca","ar":"إسكت"},"Mido":{"pt":"Mido","ar":"ميدو"}, // ----- mission -----
VIEWS.lesson = (uid) => {
  const u = allUnits().find(x => x.id === uid) || UNITS[0]; const STEPS = ['Hear', 'Chunks', 'Shadow', 'Recall', 'Write', 'Go']; let xp = 0, scores = [];
  const spk = u.chunks.filter(speakable);
  const el = h(`<div class="lesson-top"><button class="iconbtn" id="close" aria-label="Close">✕</button><div class="steps" id="steps">${STEPS.map((s, i) => `<span data-i="${i}"><i></i>${s}</span>`).join('')}</div></div><div id="body" class="lbody"></div>`);
  const body = el.querySelector('#body');
  el.querySelector('#close').onclick = () => { stopVoice(); render('missions'); };
  const go = (i) => { stopVoice(); el.querySelectorAll('#steps span').forEach((s, k) => s.className = k < i ? 'done' : k === i ? 'on' : ''); body.innerHTML = ''; [hear, chunks, shadow, recall, write, mission][i](); el.scrollTop = 0; document.getElementById('view').scrollTop = 0; };
  const box = (html) => { const b = h(html); b.className = 'stepbox'; body.appendChild(b); return b; };

  function hear() {
    const b = box(`${coach(rl(T.coach.hear), 'Listen first. Tap a line to replay it, tap any word for its meaning.')}
      <h1 class="ltitle">${esc(u.pt)}</h1>${romHTML(u.pt)}
      <div class="lines">${u.dialogue.map(([who, pt, en], i) => `<div class="line ${who === 'Você' ? 'me' : ''}" data-i="${i}"><small>${who === 'Você' ? T.you : esc(who.toUpperCase())}</small><div class="pt">${wordsHTML(pt)}</div>${romHTML(pt)}<div class="en">${esc(en)}</div></div>`).join('')}</div>
      <div class="row gap"><button class="btn" id="all">▶ Play all</button><button class="btn ghost" id="slow">Slow</button><button class="btn ghost" id="hide">Hide English</button></div>
      <div class="lesson-foot"><button class="btn wide" id="next">Next: chunks</button></div>`);
    bindGloss(b, u.gloss);
    let playing = 0;
    const play = async (slow) => { const id = ++playing; for (const [i, [, pt]] of u.dialogue.entries()) { if (id !== playing || !b.isConnected) return; b.querySelectorAll('.line').forEach((l, k) => l.classList.toggle('live', k === i)); await say(pt, slow, u.dialogue[i][0]); await sleep(250); } b.querySelectorAll('.line').forEach(l => l.classList.remove('live')); };
    b.querySelector('#all').onclick = () => play(false); b.querySelector('#slow').onclick = () => play(true);
    b.querySelectorAll('.line').forEach(l => l.onclick = () => { playing++; b.querySelectorAll('.line').forEach(x => x.classList.toggle('live', x === l)); say(u.dialogue[+l.dataset.i][1], false, u.dialogue[+l.dataset.i][0]); });
    b.querySelector('#hide').onclick = e => { b.classList.toggle('noen'); e.target.textContent = b.classList.contains('noen') ? 'Show English' : 'Hide English'; };
    b.querySelector('#next').onclick = () => { playing++; go(1); };
  }
  function chunks() {
    const b = box(`${coach(rl(T.coach.chunks), 'Whole phrases stick better than single words. Tap to hear.')}
      <div class="chunks">${u.chunks.map(([pt, en, note, heat, ns], i) => `<button class="chunk ${heat === 3 ? 'slur' : ''}" data-i="${i}" style="--c:${heat != null ? HEAT[heat][1] : 'var(--sky)'}"><div class="row"><b>${esc(pt)}</b><div class="spacer"></div>${heat != null ? `<span class="heat">${HEAT[heat][0]}</span>` : ''}${heat === 3 || ns ? '' : I('speaker')}</div>${romHTML(pt)}<small>${esc(en)}</small>${note ? `<p>${esc(note)}</p>` : ''}</button>`).join('')}</div>
      <div class="lesson-foot"><button class="btn wide" id="next">Got them: shadow it</button></div>`);
    b.querySelectorAll('.chunk').forEach(c => c.onclick = () => { const ch = u.chunks[+c.dataset.i]; c.classList.remove('hit'); void c.offsetWidth; c.classList.add('hit'); if (speakable(ch)) say(ch[0]); else if (ch[3] === 3) toast('Recognise only. Lucy won’t say this one.'); });
    b.querySelector('#next').onclick = () => { srsAdd(u.chunks); go(2); };
  }
  function shadow() {
    let k = 0;
    const draw = () => {
      body.innerHTML = ''; const [who, pt, en] = u.dialogue[k];
      const b = box(`${coach(rl(T.coach.shadow), `Line ${k + 1} of ${u.dialogue.length}. Say it right after it plays, copying the rhythm.`)}
        <div class="target"><div class="row"><span class="tag">${who === 'Você' ? 'YOU' : esc(who.toUpperCase())}</span><div class="spacer"></div><button class="iconbtn" id="slow" aria-label="Slow">0.7×</button><button class="iconbtn hi" id="hear" aria-label="Listen">${I('speaker')}</button></div>
          <div class="words" id="ws">${wordsHTML(pt)}</div>${romHTML(pt)}<div class="gloss">${esc(en)}</div><div class="heard" id="heard"></div></div>
        <div id="fb"></div>
        <div class="mic-wrap"><button class="mic" aria-label="Speak">${I('microphone')}</button></div><p class="mic-label">Tap & speak</p>
        <div class="row" style="justify-content:center"><button class="link" id="skip">Skip line</button></div>`);
      bindGloss(b, u.gloss);
      b.querySelector('#hear').onclick = () => say(pt, false, who); b.querySelector('#slow').onclick = () => say(pt, true, who);
      say(pt, false, who);
      const next = () => { k++; if (k < u.dialogue.length) draw(); else go(3); };
      b.querySelector('#skip').onclick = next;
      micButton(b, { target: pt, onPartial: t => b.querySelector('#heard').textContent = 'Heard: ' + t,
        onDone: (t, secs) => { if (!t) return; const r = scoreSpeech(pt, t, secs); scores.push(r.total); logScore(pt, r); S.stats.shadowed++; saveStats(); paintWords(b.querySelectorAll('#ws span'), r.per);
          const tip = coachTip(pt, r.per); const good = r.total >= 75;
          b.querySelector('#fb').innerHTML = coach(rl(pick(good ? T.praise : T.nudge), ` ${r.total}/100`), esc(good ? (tip ? 'One thing: ' + tip : 'Sounded natural.') : (tip || 'Try again, slower.')), good ? 'happy' : 'meh');
          if (good) { xp += 5; setTimeout(() => { if (b.isConnected) next(); }, 1700); } } });
    };
    draw();
  }
  function recall() {
    const items = shuffle(spk.filter(c => !c[4])).slice(0, 4); let k = 0;
    if (!items.length) return go(4);
    const draw = () => {
      body.innerHTML = ''; const [pt, en, , heat] = items[k];
      const b = box(`${coach(rl(T.coach.recall), `${k + 1} of ${items.length}. Pulling it out of memory is what makes it stick.`)}
        <div class="recall"><small class="eyebrow">${T.sayIn}</small><div class="big">${esc(en)}</div>
          <div class="answer" id="ans" hidden><div class="words" id="ws">${wordsHTML(pt)}</div>${romHTML(pt)}${heat ? `<span class="heat" style="--c:${HEAT[heat][1]}">${HEAT[heat][0]}</span>` : ''}</div><div class="heard" id="heard"></div></div>
        <div class="mic-wrap"><button class="mic" aria-label="Speak">${I('microphone')}</button></div><p class="mic-label">Tap & speak</p>
        <div class="row" style="justify-content:center"><button class="link" id="show">Show answer</button></div>`);
      const reveal = (ok) => { b.querySelector('#ans').hidden = false; say(pt); const s = b.querySelector('#show'); s.textContent = 'Next →'; s.onclick = () => { srsGrade(pt, ok ? 'good' : 'again'); k++; if (k < items.length) draw(); else go(4); }; };
      b.querySelector('#show').onclick = () => reveal(false);
      micButton(b, { target: pt, onPartial: t => b.querySelector('#heard').textContent = 'Heard: ' + t,
        onDone: (t, secs) => { if (!t) return; const r = scoreSpeech(pt, t, secs); scores.push(r.total); logScore(pt, r); reveal(r.total >= 75); paintWords(b.querySelectorAll('#ws span'), r.per); if (r.total >= 75) { xp += 10; toast(`${pick(T.praise)} ${r.total}/100`); } } });
    };
    draw();
  }
  function write() {
    const lines = shuffle(u.dialogue).slice(0, 3); let k = 0;
    const draw = () => {
      body.innerHTML = ''; const [who, pt, en] = lines[k];
      const b = box(`${coach(rl(T.coach.write), `${k + 1} of ${lines.length}. Listen and type it. Dictation trains your ear and your spelling at once.`)}
        <div class="target"><div class="row"><button class="btn" id="hear">▶ Play</button><button class="btn ghost" id="slow">Slow</button><div class="spacer"></div><button class="link" id="hint">Hint</button></div>
          <textarea class="write" id="w" placeholder="${T.writePh}" autocomplete="off" autocapitalize="sentences" spellcheck="false"></textarea>
          <div class="accents">${T.accents.map(c => `<button data-c="${c}">${c}</button>`).join('')}</div>
          <div class="words small" id="res" hidden></div></div>
        <div class="lesson-foot"><button class="btn wide" id="check" disabled>Check</button></div>`);
      const ta = b.querySelector('#w'); ta.oninput = () => b.querySelector('#check').disabled = !ta.value.trim();
      b.querySelector('#hear').onclick = () => say(pt, false, who); b.querySelector('#slow').onclick = () => say(pt, true, who); b.querySelector('#hint').onclick = () => toast(en);
      setTimeout(() => say(pt, false, who), 300);
      b.querySelectorAll('[data-c]').forEach(x => x.onclick = () => { const p = ta.selectionStart ?? ta.value.length; ta.value = ta.value.slice(0, p) + x.dataset.c + ta.value.slice(ta.selectionEnd ?? p); ta.focus(); ta.selectionStart = ta.selectionEnd = p + 1; ta.oninput(); });
      b.querySelector('#check').onclick = () => { const r = scoreSpeech(pt, ta.value, 0); S.stats.dict.push(r.accuracy); if (S.stats.dict.length > 100) S.stats.dict.shift(); saveStats();
        const res = b.querySelector('#res'); res.hidden = false; res.innerHTML = wordsHTML(pt) + romHTML(pt); paintWords(res.querySelectorAll('span'), r.per);
        if (r.accuracy >= 85) xp += 5;
        const c = b.querySelector('#check'); c.textContent = r.accuracy >= 85 ? `${pick(T.praise)} Next →` : 'Next →'; c.onclick = () => { k++; if (k < lines.length) draw(); else go(5); }; };
    };
    draw();
  }
  function mission() {
    const sc = allScenes().find(s => s.id === u.scene) || SCENES[0];
    S.done[u.id] = true; store.set('done', S.done); addXP(xp + 10);
    const avg = scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : null;
    const b = box(`<div class="finish">${LUCY('big happy')}<h1>${T.coach.finish}</h1>${romHTML(T.coach.finish)}<p class="sub">Now use it for real.</p>
      <div class="stats"><div><small>XP</small><b>+${xp + 10}</b></div>${avg != null ? `<div><small>SPEAKING</small><b>${avg}</b></div>` : ''}<div><small>NEW IN REVIEW</small><b>${u.chunks.filter(c => (c[3] ?? 0) < 3).length}</b></div></div>
      <div class="goalcard"><small class="eyebrow">YOUR MISSION WITH ${esc(sc.who.toUpperCase())}</small><b>${esc(u.mission)}</b></div>
      <div class="row gap" style="width:100%"><button class="btn wide" id="chat">${I('chat-bubble')} Chat</button><button class="btn wide alt" id="call">${I('phone')} Call</button></div>
      <button class="link" id="later">Back to missions</button></div>`);
    confetti();
    const start = v => { S.scene = sc.id; S.mission = u.mission; delete chats[sc.id]; render(v); };
    b.querySelector('#chat').onclick = () => start('chat'); b.querySelector('#call').onclick = () => start('call');
    b.querySelector('#later').onclick = () => render('missions');
  }
  go(0);
  return el;
};

// ----- review -----
VIEWS.review = () => {
  const due = srsDue(); const total = Object.keys(S.srs).length;
  if (!due.length) {
    const el = h(`<div class="pagehead"><h1>Review</h1><p class="sub">Spaced repetition: each phrase comes back right before you’d forget it.</p></div>
      <div class="empty">${LUCY('big sleepy')}<b>${total ? 'All caught up. Lucy’s napping.' : 'Nothing to review yet'}</b><p>${total ? `${total} phrases in your deck. The next ones come back ${(() => { const n = Math.min(...Object.values(S.srs).map(c => c.due)); const hrs = (n - Date.now()) / 36e5; return hrs < 1 ? 'within the hour' : hrs < 24 ? `in ${Math.round(hrs)} hours` : `in ${Math.round(hrs / 24)} days`; })()}.` : 'Finish a mission and its phrases land here.'}</p>
      ${total ? '<button class="btn" id="cram">Practise 8 anyway</button>' : '<button class="btn" id="go">Start a mission</button>'}</div>`);
    el.querySelector('#go')?.addEventListener('click', () => render('missions'));
    el.querySelector('#cram')?.addEventListener('click', () => { shuffle(Object.keys(S.srs)).slice(0, 8).forEach(k => S.srs[k].due = Date.now() - 1); render('review'); });
    return el;
  }
  const [pt, c] = due[0];
  const el = h(`<div class="pagehead row"><h1>Review</h1><div class="spacer"></div><span class="tag hot">${due.length} due</span></div>
    <div class="recall"><small class="eyebrow">${c.ns ? 'WHAT DOES THIS MEAN?' : T.sayIn}</small><div class="big">${esc(c.ns ? pt : c.en)}</div>
      <div class="answer" id="ans" hidden><div class="words" id="ws">${c.ns ? esc(c.en) : wordsHTML(pt)}</div>${c.ns ? '' : romHTML(pt)}${c.heat ? `<span class="heat" style="--c:${HEAT[c.heat][1]}">${HEAT[c.heat][0]}</span>` : ''}</div><div class="heard" id="heard"></div></div>
    ${c.ns ? '' : `<div class="mic-wrap"><button class="mic" aria-label="Speak">${I('microphone')}</button></div><p class="mic-label">Tap & speak</p>`}
    <div id="grade" class="grades" hidden>${[['again', 'Again', 'var(--rose)'], ['hard', 'Hard', 'var(--olive)'], ['good', 'Good', 'var(--mint)']].map(([g, l, col]) => `<button data-g="${g}" style="--c:${col}"><b>${l}</b><small>${nextLabel(pt, g)}</small></button>`).join('')}</div>
    <div class="row" style="justify-content:center" id="showrow"><button class="link" id="show">Show answer</button></div>`);
  const reveal = (sugg) => { el.querySelector('#ans').hidden = false; el.querySelector('#grade').hidden = false; el.querySelector('#showrow').hidden = true; if (!c.ns) say(pt);
    if (sugg) el.querySelector(`[data-g="${sugg}"]`).classList.add('sugg'); };
  el.querySelector('#show').onclick = () => reveal(null);
  el.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { srsGrade(pt, b.dataset.g); if (b.dataset.g !== 'again') addXP(3); render('review', true); });
  if (!c.ns) micButton(el, { target: pt, onPartial: t => el.querySelector('#heard').textContent = 'Heard: ' + t,
    onDone: (t, secs) => { if (!t) return; const r = scoreSpeech(pt, t, secs); logScore(pt, r); reveal(r.total >= 85 ? 'good' : r.total >= 60 ? 'hard' : 'again'); paintWords(el.querySelectorAll('#ws span'), r.per); el.querySelector('#heard').textContent = `Heard: ${t} · ${r.total}/100`; } });
  return el;
};

// ----- progress: levels, ETA, milestones, tricky words -----
VIEWS.progress = () => {
  const m = metrics(); const done = MILESTONES.filter(x => x[2](m)).length;
  const week = [...m.days.slice(0, 7)].reverse(), maxS = Math.max(S.goalMin * 60, ...week);
  const tricky = Object.entries(S.stats.tricky).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).slice(0, 8);
  const el = h(`<div class="pagehead"><h1>Progress</h1><p class="sub">Where you are, what’s left, and when you’ll get there at your current pace.</p></div>
    <section class="statrow"><div><small>PRACTICE</small><b>${m.hours < 1 ? Math.round(m.hours * 60) + ' min' : m.hours.toFixed(1) + ' h'}</b></div><div><small>PHRASES</small><b>${m.learned}<em>/${m.mastered} mastered</em></b></div><div><small>SPEAKING</small><b>${m.acc ?? '–'}${m.acc != null ? '%' : ''}</b></div></section>
    <section class="card"><div class="row"><h2>This week</h2><div class="spacer"></div><span class="mini">goal ${S.goalMin} min/day</span></div>
      <div class="week">${week.map((s, i) => { const d = new Date(Date.now() - (6 - i) * 864e5); return `<div class="wcol"><div class="wbar"><i style="height:${Math.round(s / maxS * 100)}%" class="${s >= S.goalMin * 60 ? 'hit' : ''}"></i><span class="goalline" style="bottom:${Math.round(S.goalMin * 60 / maxS * 100)}%"></span></div><small>${d.toLocaleDateString(({ ar: 'ar-EG', pt: 'pt-BR' })[S.ui] || 'en-GB', { weekday: 'narrow' })}</small></div>`; }).join('')}</div></section>
    <h2 class="sect">Levels</h2>
    <div class="ladder">${m.lv.map(L => `<div class="rung ${L.id === m.current.id ? 'cur' : ''} ${L.pct >= 100 ? 'got' : ''}">${ring(L.pct, 64, 7, `<b>${L.id}</b>`)}<div class="rung-txt"><div class="row"><b>${L.name}</b><div class="spacer"></div><span class="mini">${L.pct}%</span></div><p>${L.can}</p>
      ${L.pct >= 100 ? '<small class="ok">Reached</small>' : `<small>ETA <b>${fmtETA(L.daysLeft)}</b> (${fmtDate(L.daysLeft)}) · ~${Math.ceil(L.hoursLeft)} h · ${L.phrasesLeft} phrases left</small>
      <div class="subbars"><span title="Practice time"><i style="width:${Math.round(L.hp * 100)}%"></i></span><span title="Phrases"><i style="width:${Math.round(L.pp * 100)}%"></i></span><span title="Speaking accuracy"><i style="width:${Math.round(L.ap * 100)}%"></i></span></div><div class="sublbl"><small>time</small><small>phrases</small><small>accuracy ≥${L.acc}%</small></div>`}</div></div>`).join('')}</div>
    <p class="fine">How the estimate works: each level needs practice hours (Cambridge’s guided-learning ranges), phrases you can produce from memory, and speaking accuracy. Your remaining hours are divided by your real minutes per day over the last two weeks, and shortened or stretched by your accuracy.</p>
    <h2 class="sect">Milestones <span class="mini">${done}/${MILESTONES.length}</span></h2>
    <div class="miles">${MILESTONES.map(([t, d, f]) => { const ok = f(m); return `<div class="mile ${ok ? 'ok' : ''}"><span>${ok ? I('check-mark') : I('trophy')}</span><b>${t}</b><small>${d}</small></div>`; }).join('')}</div>
    <h2 class="sect">Tricky words</h2>
    ${tricky.length ? `<div class="tricky">${tricky.map(([w, n]) => `<button data-t="${esc(w)}">${esc(w)}<small>×${n}</small></button>`).join('')}</div><button class="btn ghost" id="gym" style="margin-top:10px">Practise them in the gym</button>` : '<p class="fine">Words you miss when speaking show up here.</p><button class="btn ghost" id="gym">Open the pronunciation gym</button>'}`);
  el.querySelectorAll('[data-t]').forEach(b => b.onclick = () => say(b.dataset.t, true));
  el.querySelector('#gym').onclick = () => { if (tricky.length) { PHRASES['Your tricky words'] = tricky.map(([w]) => [w, 'one of your tricky words', '']); S.deck = 'Your tricky words'; S.phrase = 0; } render('speak'); };
  animateRings(el);
  return el;
};

// ----- pronunciation gym -----
VIEWS.speak = () => {
  const list = PHRASES[S.deck] || PHRASES['Street talk']; const [pt, en, ipa] = list[S.phrase % list.length];
  const el = h(`<div class="pagehead"><button class="link" id="back">‹ Progress</button><h1>Pronunciation gym</h1><p class="sub">The mic stops by itself when you nail it.</p></div>
    <div class="deck">${Object.keys(PHRASES).map(d => `<button class="chipbtn ${d === S.deck ? 'on' : ''}" data-d="${d}">${d}</button>`).join('')}</div>
    <div class="target"><div class="row"><span class="tag">${S.phrase % list.length + 1}/${list.length}</span><div class="spacer"></div><button class="iconbtn" id="slow" aria-label="Listen slowly">0.7×</button><button class="iconbtn hi" id="hear" aria-label="Listen">${I('speaker')}</button></div>
      <div class="words" id="ws">${pt.split(' ').map(w => `<span>${esc(w)}</span>`).join(' ')}</div>${ipa ? `<div class="ipa">${ipa}</div>` : ''}<div class="gloss">${esc(en)}</div><div class="heard" id="heard"></div></div>
    <div class="score">${ring(0, 112, 11, '<b id="sv">–</b><small>score</small>')}
      <div class="meters">${[['Accuracy', 'acc'], ['Fluency', 'flu'], ['Completeness', 'com']].map(([l, k]) => `<div><label>${l}<span id="${k}v"></span></label><div class="meter"><i id="${k}"></i></div></div>`).join('')}</div></div>
    <div id="fb"></div>
    <div class="mic-wrap"><button class="mic" aria-label="Speak">${I('microphone')}</button></div><p class="mic-label">Tap & speak</p>
    <div class="row" style="justify-content:center;gap:16px"><button class="link" id="next">Next phrase →</button></div>`);
  el.querySelector('#back').onclick = () => render('progress');
  el.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { S.deck = b.dataset.d; S.phrase = 0; render('speak', false); });
  el.querySelector('#hear').onclick = () => say(pt); el.querySelector('#slow').onclick = () => say(pt, true);
  el.querySelector('#next').onclick = () => { S.phrase++; render('speak', false); };
  const show = (t, secs) => {
    const r = scoreSpeech(pt, t, secs); logScore(pt, r); paintWords(el.querySelectorAll('#ws span'), r.per);
    const arc = el.querySelector('.arc'); arc.style.strokeDashoffset = parseFloat(arc.getAttribute('stroke-dasharray')) * (1 - r.total / 100);
    let n = 0; const sv = el.querySelector('#sv'); const iv = setInterval(() => { n = Math.min(r.total, n + Math.max(1, Math.ceil(r.total / 20))); sv.textContent = n; if (n >= r.total) clearInterval(iv); }, 40);
    [['acc', r.accuracy], ['flu', r.fluency], ['com', r.completeness]].forEach(([k, v]) => { el.querySelector('#' + k).style.width = v + '%'; el.querySelector('#' + k + 'v').textContent = v; });
    const tip = coachTip(pt, r.per);
    el.querySelector('#fb').innerHTML = coach(tip ? rl(pick(T.nudge)) : rl(pick(T.praise)), esc(tip || 'Clear and natural. Next one.') + (P.sample ? ' <button class="link" id="deep">Ask Lucy for more</button>' : ''), tip ? 'meh' : 'happy');
    el.querySelector('#deep')?.addEventListener('click', async ev => { ev.target.textContent = 'Thinking…';
      try { const r2 = await P.sample(`You are Lucy, a sarcastic cat who coaches ${T.ai.name(S.variant)} pronunciation. The learner tried to say: "${pt}". A speech recogniser heard: "${t}". In 2-3 short sentences of plain ${UI_NAME()}, tell them which sounds to fix and how (mouth position, an English sound it resembles).${S.vibe === 'spicy' ? ' Be funny and a little sarcastic.' : ''} No preamble.`, { modelTier: 'quick' });
        ev.target.closest('small').textContent = r2.text; } catch (_) { ev.target.textContent = 'Lucy is busy, try later'; } });
    if (r.total >= 80) addXP(5);
  };
  micButton(el, { target: pt, onPartial: t => el.querySelector('#heard').textContent = 'Heard: ' + t, onDone: (t, secs) => { if (t) { el.querySelector('#heard').textContent = 'Heard: ' + t; show(t, secs); } } });
  return el;
};

// ----- talk -----
VIEWS.talk = () => {
  const sc = allScenes();
  const el = h(`<div class="pagehead"><h1>Talk</h1><p class="sub">Real conversations by chat or call. ${S.vibe === 'spicy' ? 'Expect to get roasted.' : 'Friendly mode is on.'}</p></div>
    <div class="scenes">${sc.map((s, i) => `<div class="scene ${s.id === 'lucy' ? 'feature' : ''}" style="--c:${s.c};animation-delay:${i * 40}ms"><span class="av">${s.icon === 'lucy' ? LUCY() : I(s.icon)}</span><div class="sbody"><b>${esc(s.pt)}</b><small>${esc(s.en)} · ${esc(s.who)}</small></div>
      <div class="acts"><button class="iconbtn" data-chat="${s.id}" aria-label="Chat">${I('chat-bubble')}</button><button class="iconbtn hi" data-call="${s.id}" aria-label="Call">${I('phone')}</button></div></div>`).join('')}</div>`);
  el.querySelectorAll('[data-chat]').forEach(b => b.onclick = () => { S.scene = b.dataset.chat; S.mission = null; render('chat'); });
  el.querySelectorAll('[data-call]').forEach(b => b.onclick = () => { S.scene = b.dataset.call; S.mission = null; render('call'); });
  return el;
};

const chats = {};
VIEWS.chat = () => {
  const sc = allScenes().find(s => s.id === S.scene) || SCENES[0]; const hist = chats[sc.id] = chats[sc.id] || [];
  const av = sc.id === 'lucy' ? LUCY() : `<span class="letter">${esc(sc.who[0])}</span>`;
  const el = h(`<div class="chat-head"><button class="iconbtn" id="back" aria-label="Back">‹</button><span class="av" style="--c:${sc.c}">${av}</span><div style="min-width:0;flex:1"><b>${esc(sc.who)}</b><small>${esc(sc.pt)} · ${S.vibe === 'spicy' ? 'will roast you' : 'friendly'}</small></div><button class="iconbtn hi" id="call" aria-label="Voice call">${I('phone')}</button></div>
    <div class="msgs" id="msgs">${S.mission ? `<div class="mission-tag">Mission: ${esc(S.mission)}</div>` : ''}</div>
    <div class="sugg" id="sugg"></div>
    <div class="composer"><input id="inp" placeholder="${T.chatPh}" autocomplete="off"><button class="iconbtn mic-s" id="mic" aria-label="Speak">${I('microphone')}</button><button class="iconbtn hi" id="send" aria-label="Send">➤</button></div>
    <p class="fine center">${P.sample ? 'Live AI partner · answers anything you say' : (window.claude ? 'Practice script · open in claude.ai for the live AI partner' : 'Practice script · add your free Gemini key in settings for the live AI partner')}</p>`);
  const msgs = el.querySelector('#msgs'), inp = el.querySelector('#inp');
  const scrollEnd = () => { const v = document.getElementById('view'); v.scrollTo({ top: v.scrollHeight, behavior: 'smooth' }); };
  const add = (m) => { const d = document.createElement('div');
    if (m.who === 'fix') { d.className = 'fix'; d.innerHTML = `${LUCY('xs')}<div>Try: <b>${esc(m.better)}</b>${romHTML(m.better)}${esc(m.why || '')}</div>`; }
    else { d.className = 'msg ' + m.who; d.innerHTML = esc(m.pt) + (m.who !== 'me' ? romHTML(m.pt) : '') + (m.who === 'bot' ? `<button class="say" aria-label="Listen">${I('speaker')}</button>${m.en ? `<small>${esc(m.en)}</small>` : ''}` : ''); d.querySelector('.say')?.addEventListener('click', () => say(m.pt, false, sc.who)); }
    msgs.appendChild(d); scrollEnd(); };
  const setSugg = s => { hist.sugg = s; el.querySelector('#sugg').innerHTML = s.map(x => `<button class="chipbtn" data-x="${esc(x)}">${esc(x)}${romOf(x) ? `<small>${esc(romOf(x))}</small>` : ''}</button>`).join(''); el.querySelectorAll('#sugg .chipbtn').forEach(b => b.onclick = () => send(b.dataset.x)); };
  async function botTurn() { const t = document.createElement('div'); t.className = 'typing'; t.innerHTML = '<i></i><i></i><i></i>'; msgs.appendChild(t); scrollEnd();
    const [r] = await Promise.all([partnerReply(sc.id, hist.filter(m => m.who !== 'fix'), S.mission), sleep(600)]); t.remove();
    if (r.fix) { const f = { who: 'fix', ...r.fix }; hist.push(f); add(f); }
    const m = { who: 'bot', pt: r.pt, en: r.en }; hist.push(m); add(m); setSugg(r.sugg); }
  async function send(text) { text = text.trim(); if (!text) return; inp.value = ''; const m = { who: 'me', pt: text }; hist.push(m); add(m); setSugg([]); addXP(2); S.stats.chats++; saveStats(); await botTurn(); }
  hist.forEach(add); if (hist.sugg) setSugg(hist.sugg);
  if (!hist.length) setTimeout(botTurn, 250);
  el.querySelector('#send').onclick = () => send(inp.value); inp.onkeydown = e => { if (e.key === 'Enter') send(inp.value); };
  el.querySelector('#mic').onclick = () => listen({ onState: on => el.querySelector('#mic').classList.toggle('live', on), onPartial: t => inp.value = t, onDone: t => { if (t) send(t); } });
  el.querySelector('#call').onclick = () => render('call');
  el.querySelector('#back').onclick = () => render('talk');
  return el;
};

VIEWS.call = () => {
  const sc = allScenes().find(s => s.id === S.scene) || SCENES[0]; const hist = []; let alive = true, t0 = Date.now(), slow = false, lastSugg = [];
  const el = h(`<div class="call-top"><b>${esc(sc.who)}</b><small id="tm">00:00 · ${esc(sc.pt)}</small></div>
    <div class="orb-wrap" id="ow" style="--c:${sc.c}"><div class="orb">${sc.id === 'lucy' ? LUCY('big') : `<span class="letter">${esc(sc.who[0])}</span>`}</div></div>
    <div class="wave" id="wave">${Array.from({ length: 21 }, (_, i) => `<i style="--h:${10 + Math.round(Math.abs(Math.sin(i * .9)) * 40)}px;animation-delay:${(i % 6) * .08}s"></i>`).join('')}</div>
    <div class="captions" id="cap"><small>${esc(sc.who.toUpperCase())}</small><div class="pt">${T.coach.calling}</div><div class="en">Calling…</div></div>
    <div class="controls"><button class="ctrl" id="slow"><span>0.7×</span>Slower</button><button class="ctrl main" id="talk"><span>${I('microphone')}</span>Tap to talk</button><button class="ctrl" id="hint"><span>${I('sparkles')}</span>Hint</button></div>
    <button class="btn ghost endcall" id="end">End call</button>`);
  el.classList.add('call');
  S.stats.calls++; saveStats();
  const tm = setInterval(() => { if (!alive || !el.isConnected) return clearInterval(tm); const s = (Date.now() - t0) / 1000 | 0; el.querySelector('#tm').textContent = `${String(s / 60 | 0).padStart(2, '0')}:${String(s % 60).padStart(2, '0')} · ${S.mission || sc.pt}`; }, 1000);
  const cap = (who, pt, en) => { el.querySelector('#cap').innerHTML = `<small>${esc(who)}</small><div class="pt">${esc(pt)}</div>${romHTML(pt)}<div class="en">${esc(en || '')}</div>`; };
  async function bot() { if (!alive) return; cap(sc.who.toUpperCase(), '…', '');
    const r = await partnerReply(sc.id, hist, S.mission, 'call'); if (!alive) return; hist.push({ who: 'bot', pt: r.pt, en: r.en }); lastSugg = r.sugg;
    cap(sc.who.toUpperCase(), r.pt, r.en); el.querySelector('#ow').classList.add('talk'); el.querySelector('#wave').classList.add('on');
    await say(r.pt, slow, sc.who); if (!alive) return; el.querySelector('#ow').classList.remove('talk'); el.querySelector('#wave').classList.remove('on');
    el.querySelector('#talk').classList.add('ready'); }
  setTimeout(bot, 500);
  el.querySelector('#slow').onclick = () => { slow = !slow; toast(slow ? `${sc.who} will speak slowly` : 'Normal speed'); const l = hist.filter(m => m.who === 'bot').pop(); if (l) say(l.pt, slow, sc.who); };
  el.querySelector('#hint').onclick = () => toast(lastSugg.length ? 'Try: ' + lastSugg.join(' · ') : T.hint);
  el.querySelector('#talk').onclick = () => { stopVoice(); el.querySelector('#talk').classList.remove('ready'); listen({ silenceMs: 1600,
    onState: on => { el.querySelector('#talk').classList.toggle('live', on); el.querySelector('#wave').classList.toggle('on', on); },
    onPartial: t => cap('YOU', t, ''), onDone: async t => { if (!t) return; cap('YOU', t, ''); hist.push({ who: 'me', pt: t }); addXP(3); await sleep(300); bot(); } }); };
  el.querySelector('#end').onclick = () => { alive = false; stopVoice(); render('talk'); };
  return el;
};

render('home', false);
</script></body></html>
